name: "Windows Preview"

on: workflow_dispatch

jobs:
  build-windows:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
    with:
      platform: windows-latest
      target: x86_64-pc-windows-msvc
      ref: ${{ github.sha }}
      sign-binaries: false
      asset-prefix: voxdara-windows-preview
      upload-artifacts: true
      no-cache: true

  create-draft-prerelease:
    if: github.ref == 'refs/heads/main'
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the built main commit
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download verified Windows installer
        uses: actions/download-artifact@v8
        with:
          name: voxdara-windows-preview-x86_64-pc-windows-msvc
          path: candidate

      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            echo "Expected a prerelease version, got: $VERSION" >&2
            exit 1
          fi

          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists: $TAG" >&2
            exit 1
          fi

          mapfile -t installers < <(find candidate -type f -name '*.exe')
          if [[ ${#installers[@]} -ne 1 ]]; then
            echo "Expected exactly one NSIS installer, found ${#installers[@]}" >&2
            exit 1
          fi

          mkdir release-assets
          INSTALLER="Voxdara-$VERSION-win-x64.exe"
          mv "${installers[0]}" "release-assets/$INSTALLER"
          (
            cd release-assets
            sha256sum "$INSTALLER" > "$INSTALLER.sha256"
          )

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "installer=$INSTALLER" >> "$GITHUB_OUTPUT"

      - name: Create draft prerelease
        shell: bash
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "release-assets/${{ steps.release.outputs.installer }}" \
            "release-assets/${{ steps.release.outputs.installer }}.sha256" \
            --draft \
            --prerelease \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "Voxdara ${{ steps.release.outputs.tag }} (Windows x64 Preview)" \
            --notes-file ".github/release-notes/${{ steps.release.outputs.tag }}.md"
